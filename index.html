<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3fb" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CheapToken Radar｜便宜 AI API 價格雷達 × 採購帳本" />
    <meta
      property="og:description"
      content="較為全面的 AI API 價格總結：12 平台 54 模型即時監測、最低／最高價、價格×智力曲線、Agent 月成本試算，一鍵匯出 Excel。"
    />
    <title>CheapToken Radar｜便宜 AI API 價格雷達 × 採購帳本</title>
    <meta
      name="description"
      content="CheapToken Radar：較為全面的 AI API 價格總結。12 平台 54 模型即時監測、最低／最高價、價格×智力曲線、Agent 月成本試算，一鍵匯出 Excel。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238b5cf6'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%230b0716'/%3E%3Ctext x='16' y='21' font-size='12' font-family='monospace' fill='%23c4b5fd' text-anchor='middle'%3E%C2%A5%3C/text%3E%3C/svg%3E"
    />
    <!-- 防主題閃爍：在首幀前同步設好 data-theme（預設白天） -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var t = q === "light" || q === "dark" ? q : localStorage.getItem("api-ledger-theme");
          if (t !== "light" && t !== "dark") t = "light";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 精簡字重：減少移動端字體下載與渲染開銷 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      html[data-theme="light"] body { background-color: #f4f3fb; }
      html[data-theme="dark"] body { background-color: #0b0716; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
